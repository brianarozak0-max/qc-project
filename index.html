<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--prog:#1E6FD9;--ink:#14213D;--bg:#EEF1F5;--card:#fff;--line:#D5DBE4;--mute:#5B667A;--hat:#FFB400;--open:#D9822B;--over:#C62828;--ok:#2E7D32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;padding-bottom:80px}
h1,h2,.num,.tab,.btn{font-family:'Barlow Semi Condensed',system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;border-left:6px solid var(--hat);padding-left:10px}
header button{background:none;border:1px solid #fff5;color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
.ruler{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
.ruler .num{font-size:48px;font-weight:700;line-height:1}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:10px;padding:10px 6px;text-align:center}
.tile b{display:block;font:700 26px 'Barlow Semi Condensed',sans-serif}
.tile span{font-size:13px;color:var(--mute)}
h2{font-size:18px;margin:18px 0 8px}
.row{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.row .bar{margin:0;height:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;font-weight:500;margin:14px 0 4px;font-size:15px}
.card{background:var(--card);border-radius:10px;padding:12px 12px 12px 16px;margin:10px 0;border-left:6px solid var(--open)}
.btn.sm.del{background:#fff;color:var(--over);border:1px solid var(--over)}.card.prog{border-color:var(--prog)}.card.over{border-color:var(--over)}.card.closed{border-color:var(--ok)}
.card .top{display:flex;justify-content:space-between;font:700 15px 'Barlow Semi Condensed',sans-serif}
.card p{margin:6px 0}.meta{font-size:13px;color:var(--mute)}
.card a{color:var(--ink);font-weight:500}
.btn{border:0;border-radius:10px;padding:13px 18px;font-size:17px;font-weight:700;background:var(--hat);color:var(--ink);width:100%;margin-top:18px}
.btn.sm{width:auto;padding:8px 14px;font-size:15px;margin:8px 0 0;background:var(--ink);color:#fff}
.btn:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:0;padding:14px 0;font-size:16px;font-weight:700;color:var(--mute)}
.tab.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--hat)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
.empty{text-align:center;color:var(--mute);padding:30px 0}
img.prev{max-width:100%;border-radius:8px;margin-top:8px}
#ed,#cl,#ev{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column}
#ed[hidden],#cl[hidden],#ev[hidden]{display:none}
#ed{background:#000;justify-content:center}
#ed canvas{display:block;margin:0 auto;max-width:100%;max-height:calc(100vh - 80px);touch-action:none}
#ed .acts{display:flex;gap:8px;padding:10px;background:var(--ink);position:absolute;bottom:0;left:0;right:0}
#ed .acts .btn{margin:0;flex:1;font-size:16px;padding:11px 6px}
#cl,#ev{background:#0009;justify-content:center}
#cl .box,#ev .box{background:#fff;margin:0 16px;border-radius:12px;padding:16px;max-height:90vh;overflow:auto}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.hero svg{width:120px;flex:none}.hero .big{font:700 22px 'Barlow Semi Condensed';margin-bottom:8px}
.leg{display:grid;gap:6px;font-size:14px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.panel{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px #14213d14}
.panel h2{margin:0 0 10px;font-size:17px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}.stack i{display:block}
.late{color:var(--over)}.soon{color:var(--open)}
.it{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;border-left:6px solid var(--open);box-shadow:0 1px 2px #14213d14}
.it.prog{border-color:var(--prog)}.it.over{border-color:var(--over)}.it.closed{border-color:var(--ok)}
.it-h{display:flex;gap:8px;align-items:center;font:700 15px 'Barlow Semi Condensed',sans-serif}
.it-h .st{margin-left:auto;font-size:13px;padding:3px 10px;border-radius:12px;background:#FBEBD9;color:var(--open)}
.it.prog .st{background:#E3EEFB;color:var(--prog)}.it.over .st{background:#FDE2E1;color:var(--over)}.it.closed .st{background:#E3F4E6;color:var(--ok)}
.sev{color:#fff;background:var(--c);padding:2px 8px;border-radius:10px;font-size:12px}
.it-b{display:flex;gap:10px;margin:8px 0}
.th{flex:none;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--line)}.th img{width:100%;height:100%;object-fit:cover}
.ds{margin:0 0 6px;font-weight:500}
.chips2{display:flex;flex-wrap:wrap;gap:6px}.chips2 span{background:var(--bg);border-radius:10px;padding:2px 9px;font-size:13px;color:var(--mute)}
.it-f{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.pic i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-style:normal;margin-right:6px}
.act br{display:none}
</style>
</head>
<body>
<header><h1>QC Monitor</h1><span id="net" style="font-size:13px;opacity:.8"></span><button onclick="reload()">Muat ulang</button></header>
<main>
  <section id="v-dash" class="view on"></section>
  <section id="v-list" class="view">
    <div class="chips" id="chips"></div>
    <input id="q" placeholder="Cari lokasi, deskripsi, atau nomor NCR" oninput="renderList()">
    <div id="list"></div>
  </section>
  <section id="v-add" class="view">
    <h2>Catat temuan baru</h2>
    <label>Disiplin</label><select id="f-disiplin"></select>
    <label>Lokasi</label><input id="f-lokasi" list="dl-lokasi" placeholder="Pilih atau ketik lokasi"><datalist id="dl-lokasi"></datalist>
    <label>Deskripsi temuan</label><textarea id="f-desk" rows="4" placeholder="Contoh: Support pipa chilled water kurang, jarak lebih dari 3 m"></textarea>
    <label>Tingkat keparahan</label><select id="f-sev"></select>
    <label>PIC perbaikan</label><select id="f-pic"></select>
    <label>Batas waktu perbaikan</label><input id="f-due" type="date">
    <label>Nama inspektur</label><input id="f-by" placeholder="Nama Anda">
    <label>Foto (ambil dulu dengan kamera HP, lalu pilih dari galeri)</label><input id="f-foto" type="file" accept="image/*" onchange="prevFoto(this)">
    <img id="prev" class="prev" hidden>
    <button class="btn sm" id="mark" hidden onclick="markFoto()">Tandai bagian yang perlu diperbaiki</button>
    <button class="btn" id="save" onclick="save()">Simpan temuan</button>
  </section>
</main>
<nav>
  <button class="tab on" data-v="dash">Ringkasan</button>
  <button class="tab" data-v="list">Temuan</button>
  <button class="tab" data-v="add">Tambah</button>
</nav>
<div id="ed" hidden>
  <canvas id="cv"></canvas>
  <div class="acts"><button class="btn" onclick="edUndo()">Urungkan</button><button class="btn" onclick="edClose(false)">Batal</button><button class="btn" onclick="edClose(true)">Selesai</button></div>
</div>
<div id="cl" hidden><div class="box">
  <h2 id="cl-t">Tutup temuan</h2>
  <p class="meta">Lampirkan foto bukti perbaikan (pilih dari galeri). Tanpa foto, temuan tidak bisa ditutup.</p>
  <input id="cl-foto" type="file" accept="image/*" onchange="prevBukti(this)">
  <img id="cl-prev" class="prev" hidden>
  <button class="btn" id="cl-ok" onclick="sendClose()" disabled>Kirim bukti dan tutup</button>
  <button class="btn sm" onclick="$('cl').hidden = true">Batal</button>
</div></div>
<div id="ev" hidden><div class="box">
  <h2 id="ev-t">Edit temuan</h2>
  <label>Disiplin</label><select id="e-disiplin"></select>
  <label>Lokasi</label><input id="e-lokasi" list="dl-lokasi">
  <label>Deskripsi temuan</label><textarea id="e-desk" rows="4"></textarea>
  <label>Tingkat keparahan</label><select id="e-sev"></select>
  <label>PIC perbaikan</label><select id="e-pic"></select>
  <label>Batas waktu perbaikan</label><input id="e-due" type="date">
  <label>Ganti foto (opsional, pilih dari galeri)</label><input id="e-foto" type="file" accept="image/*" onchange="prevEdFoto(this)">
  <img id="e-prev" class="prev" hidden>
  <button class="btn" onclick="sendEdit()">Simpan perubahan</button>
  <button class="btn sm" onclick="$('ev').hidden = true">Batal</button>
</div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzD8RH162Xi4aFFDN_DFZv94NtSUzOuAvU8WKiYCSryNfznOfQI-JN9QnUMU8vp8xAlxg/exec', KEY = 'aku sangat tampan';
let D = {config:{}, findings:[]}, P = [], filter = 'Semua', foto = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const isOver = f => f.status !== 'Closed' && f.due && f.due < today();

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  localStorage.setItem('tab', b.dataset.v);
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  window.scrollTo(0, 0);
});

const dbp = new Promise((ok, no) => { const r = indexedDB.open('qc', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('q', {keyPath: 'cid'}); r.result.createObjectStore('kv'); };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const tx = (s, m, fn) => dbp.then(db => new Promise((ok, no) => {
  const t = db.transaction(s, m), o = fn(t.objectStore(s));
  t.oncomplete = () => ok(o && o.result); t.onerror = () => no(t.error); }));

async function api(body) {
  const r = await fetch(API, {method: 'POST', body: JSON.stringify(Object.assign({key: KEY}, body))});
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Server menolak data.'); e.server = true; throw e; }
  return j;
}

async function load() {
  // 1) tampilkan dulu dari data tersimpan di HP (langsung, tanpa menunggu sinyal)
  if (!D.config.disiplin) {
    const c = await tx('kv', 'readonly', s => s.get('init'));
    if (c) { D = c; fillForm(); restoreDraft(); await refreshQ(); render(); }
  }
  // 2) perbarui dari server di belakang layar, dengan batas waktu
  try {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch(API + '?action=init&key=' + encodeURIComponent(KEY), {signal: ctl.signal});
    clearTimeout(tm);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    D = j; tx('kv', 'readwrite', s => s.put(D, 'init'));
  } catch (e) {
    if (!D.config.disiplin) return toast('Belum ada data tersimpan. Buka sekali saat ada sinyal.');
    return toast(e instanceof TypeError || e.name === 'AbortError' ? 'Sinyal lemah: memakai data tersimpan' : e.message);
  }
  fillForm(); restoreDraft(); await refreshQ(); render();
}

async function refreshQ() {
  P = await tx('q', 'readonly', s => s.getAll());
  $('net').textContent = (navigator.onLine ? 'Online' : 'Offline') + (P.length ? ' | ' + P.length + ' menunggu kirim' : '');
}

let busy = false;
async function sync() {
  if (busy || !navigator.onLine) return;
  busy = true; let sent = 0;
  try {
    for (const it of await tx('q', 'readonly', s => s.getAll())) {
      try {
        await api(it.action === 'close' ? {action: 'close', no: it.no, foto: it.foto, by: it.by}
          : it.action === 'start' ? {action: 'start', no: it.no, by: it.by}
          : it.action === 'delete' ? {action: 'delete', no: it.no, by: it.by}
          : it.action === 'edit' ? {action: 'edit', no: it.no, data: it.data, foto: it.foto, by: it.by}
          : {action: 'add', cid: it.cid, data: it.data, by: it.by});
        await tx('q', 'readwrite', s => s.delete(it.cid)); sent++;
      } catch (e) {
        if (!e.server) break;
        it.err = e.message; await tx('q', 'readwrite', s => s.put(it));
      }
    }
  } finally { busy = false; }
  if (sent) { toast(sent + ' temuan terkirim'); await load(); } else { await refreshQ(); renderList(); }
}

function pendHtml() {
  return P.map(p => `<div class="card over"><div class="top"><span>Menunggu kirim</span><span>${p.err ? 'Gagal' : 'Antri'}</span></div>` +
    (p.action === 'close' ? `<p>Tutup ${esc(p.no)} dengan foto bukti</p>`
      : p.action === 'start' ? `<p>Mulai dikerjakan ${esc(p.no)}</p>`
      : p.action === 'delete' ? `<p>Hapus ${esc(p.no)}</p>`
      : p.action === 'edit' ? `<p>Edit ${esc(p.no)}</p>`
      : `<p>${esc(p.data.desk)}</p><div class="meta">${esc(p.data.disiplin)} - ${esc(p.data.lokasi)}</div>`) +
    (p.err ? `<div class="meta">${esc(p.err)}</div>` : '') +
    `<button class="btn sm del" onclick="cancelQ('${esc(p.cid)}')">Batalkan</button></div>`).join('');
}

let editing = null, edFoto = null;
function setSel(el, v) {
  if (v && ![...el.options].some(o => o.value === v)) el.add(new Option(v, v));
  el.value = v || '';
}
function editIt(no) {
  const f = D.findings.find(x => x.no === no); if (!f) return;
  const c = D.config;
  opts($('e-disiplin'), c.disiplin); opts($('e-sev'), c.severity); opts($('e-pic'), c.pic);
  setSel($('e-disiplin'), f.disiplin); setSel($('e-sev'), f.severity); setSel($('e-pic'), f.pic);
  $('e-lokasi').value = f.lokasi; $('e-desk').value = f.desk; $('e-due').value = f.due || '';
  editing = no; edFoto = null; $('e-foto').value = ''; $('e-prev').hidden = true;
  $('ev-t').textContent = 'Edit ' + no; $('ev').hidden = false;
}
async function prevEdFoto(inp) {
  const file = inp.files[0]; edFoto = null; $('e-prev').hidden = true;
  if (!file) return;
  edFoto = await compress(file); $('e-prev').src = src(edFoto); $('e-prev').hidden = false;
}
async function sendEdit() {
  const d = {disiplin: $('e-disiplin').value, lokasi: $('e-lokasi').value.trim(), desk: $('e-desk').value.trim(),
    severity: $('e-sev').value, pic: $('e-pic').value, due: $('e-due').value};
  if (!d.lokasi || !d.desk) return toast('Isi lokasi dan deskripsi dulu.');
  const by = (localStorage.getItem('by') || $('f-by').value || '').trim();
  if (!by) { $('ev').hidden = true; return toast('Isi nama inspektur di tab Tambah dulu.'); }
  await tx('q', 'readwrite', s => s.put({cid: crypto.randomUUID(), action: 'edit', no: editing, data: d, foto: edFoto, by, at: Date.now()}));
  $('ev').hidden = true;
  toast(navigator.onLine ? 'Mengirim perubahan...' : 'Tersimpan di HP, dikirim saat ada sinyal');
  await refreshQ(); renderList(); sync();
}

async function cancelQ(cid) {
  if (busy) return toast('Sedang mengirim, coba lagi sebentar.');
  if (!confirm('Batalkan kiriman ini? Data yang belum terkirim akan dibuang dari HP.')) return;
  await tx('q', 'readwrite', s => s.delete(cid));
  await refreshQ(); renderList();
}
async function reload() { await sync(); await load(); }

function acts(f) {
  if (P.some(p => p.no === f.no)) return '';
  const n = esc(f.no);
  return '<br>' + (f.status !== 'Closed' ? `<button class="btn sm" onclick="editIt('${n}')">Edit</button> ` : '') + (f.status === 'Open' ? `<button class="btn sm" onclick="startIt('${n}')">Mulai dikerjakan</button> ` : '') +
    (f.status !== 'Closed' ? `<button class="btn sm" onclick="closeIt('${n}')">Tutup dengan foto bukti</button> ` : '') +
    `<button class="btn sm del" onclick="delIt('${n}')">Hapus</button>`;
}
async function delIt(no) {
  const by = (localStorage.getItem('by') || $('f-by').value || '').trim();
  if (!by) return toast('Isi nama inspektur di tab Tambah dulu.');
  if (!confirm('Hapus temuan ' + no + '? Temuan disembunyikan dari aplikasi, tapi datanya tetap tersimpan di spreadsheet.')) return;
  await tx('q', 'readwrite', s => s.put({cid: crypto.randomUUID(), action: 'delete', no, by, at: Date.now()}));
  toast(navigator.onLine ? 'Menghapus...' : 'Tersimpan di HP, dikirim saat ada sinyal');
  await refreshQ(); renderList(); sync();
}
async function startIt(no) {
  await tx('q', 'readwrite', s => s.put({cid: crypto.randomUUID(), action: 'start', no, by: localStorage.getItem('by') || '', at: Date.now()}));
  toast(navigator.onLine ? 'Mengirim...' : 'Tersimpan di HP, dikirim saat ada sinyal');
  await refreshQ(); renderList(); sync();
}

function opts(el, arr) { el.innerHTML = arr.map(v => `<option>${esc(v)}</option>`).join(''); }
function fillForm() {
  const c = D.config;
  opts($('f-disiplin'), c.disiplin); opts($('f-sev'), c.severity); opts($('f-pic'), c.pic);
  $('dl-lokasi').innerHTML = c.lokasi.map(v => `<option value="${esc(v)}">`).join('');
  if (!$('f-due').value) { const d = new Date(); d.setDate(d.getDate() + 7); $('f-due').value = d.toISOString().slice(0, 10); }
}

function render() { renderDash(); renderChips(); renderList(); }

const SEV = {PENTING: '#C62828', SEDANG: '#E69100', SANTAI: '#2E7D32', Kritis: '#C62828', Major: '#E69100', Minor: '#5B667A'};

function donut(parts, pct) {
  const R = 48, C = 2 * Math.PI * R, tot = parts.reduce((a, p) => a + p[0], 0) || 1; let off = 0;
  return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#ffffff22" stroke-width="14"/>` +
    parts.map(([n, c]) => { const l = n / tot * C, e = n ? `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${c}" stroke-width="14" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>` : ''; off += l; return e; }).join('') +
    `<text x="60" y="67" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" font-family="Barlow Semi Condensed,sans-serif">${pct}%</text></svg>`;
}

function renderDash() {
  const F = D.findings, n = F.length, closed = F.filter(f => f.status === 'Closed').length;
  const prog = F.filter(f => f.status === 'Dikerjakan').length, open = n - closed - prog;
  const over = F.filter(isOver).length, pct = n ? Math.round(closed / n * 100) : 0;
  const by = {}, pic = {}, W = [0, 1, 2, 3, 4, 5].map(() => [0, 0]);
  const wk = d => d ? Math.floor((new Date(today()) - new Date(d)) / 6048e5) : -1;
  F.forEach(f => {
    const k = f.disiplin || '-'; by[k] = by[k] || {o: 0, p: 0, c: 0};
    by[k][f.status === 'Closed' ? 'c' : f.status === 'Dikerjakan' ? 'p' : 'o']++;
    if (f.status !== 'Closed') { const q = f.pic || 'Belum ada PIC'; pic[q] = pic[q] || {n: 0, l: 0}; pic[q].n++; if (isOver(f)) pic[q].l++; }
    const a = wk(f.tgl), b = wk(f.tutup);
    if (a >= 0 && a < 6) W[a][0]++; if (b >= 0 && b < 6) W[b][1]++;
  });
  const seg = (v, t, c) => v ? `<i style="width:${v / t * 100}%;background:${c}"></i>` : '';
  const maxP = Math.max(1, ...Object.values(pic).map(x => x.n)), mx = Math.max(1, ...W.flat());
  const bars = W.map((w, i) => { const x = (5 - i) * 48 + 8, h0 = w[0] / mx * 70, h1 = w[1] / mx * 70;
    return `<rect x="${x}" y="${90 - h0}" width="16" height="${h0}" rx="3" fill="#FFB400"/><rect x="${x + 18}" y="${90 - h1}" width="16" height="${h1}" rx="3" fill="#43A047"/><text x="${x + 17}" y="105" text-anchor="middle" font-size="10" fill="#5B667A">${i ? '-' + i : 'ini'}</text>`; }).join('');
  if (!n) { $('v-dash').innerHTML = '<div class="empty">Belum ada temuan. Buka tab Tambah untuk mencatat yang pertama.</div>'; return; }
  $('v-dash').innerHTML = `
    <div class="hero">${donut([[closed, '#43A047'], [prog, '#4C97F0'], [open, '#FFB400']], pct)}
      <div><div class="big">${n} temuan</div><div class="leg">
        <span><i style="background:#FFB400"></i>Open ${open}</span>
        <span><i style="background:#4C97F0"></i>Dikerjakan ${prog}</span>
        <span><i style="background:#43A047"></i>Closed ${closed}</span></div></div></div>
    <div class="tiles">
      <div class="tile"><b style="color:var(--open)">${open}</b><span>Open</span></div>
      <div class="tile"><b style="color:var(--prog)">${prog}</b><span>Dikerjakan</span></div>
      <div class="tile"><b style="color:var(--over)">${over}</b><span>Overdue</span></div>
      <div class="tile"><b style="color:var(--ok)">${closed}</b><span>Closed</span></div>
    </div>
    <div class="panel"><h2>Per disiplin</h2>` + Object.keys(by).map(k => { const v = by[k], t = v.o + v.p + v.c;
      return `<div class="row"><span>${esc(k)}</span><div class="stack">${seg(v.c, t, 'var(--ok)')}${seg(v.p, t, 'var(--prog)')}${seg(v.o, t, 'var(--open)')}</div><span class="meta">${v.c}/${t}</span></div>`; }).join('') + `</div>
    <div class="panel"><h2>Beban per PIC <span class="meta">(belum closed, merah = terlambat)</span></h2>` +
      (Object.keys(pic).length ? Object.keys(pic).sort((a, b) => pic[b].n - pic[a].n).map(k => { const v = pic[k];
        return `<div class="row"><span>${esc(k)}</span><div class="stack">${seg(v.l, maxP, 'var(--over)')}${seg(v.n - v.l, maxP, 'var(--prog)')}</div><span class="meta">${v.n}</span></div>`; }).join('') : '<div class="empty">Semua temuan sudah closed.</div>') + `</div>
    <div class="panel"><h2>Tren 6 minggu</h2>
      <svg viewBox="0 0 300 110" style="width:100%">${bars}</svg>
      <div class="meta"><span style="color:#E69100">&#9632;</span> Temuan baru &nbsp; <span style="color:#43A047">&#9632;</span> Ditutup (angka minggu ke belakang)</div></div>`;
}

function renderChips() {
  $('chips').innerHTML = ['Semua', 'Open', 'Dikerjakan', 'Overdue', 'Closed'].map(c =>
    `<button class="chip ${c === filter ? 'on' : ''}" onclick="filter='${c}';renderChips();renderList()">${c}</button>`).join('');
}

function dueInfo(f) {
  if (f.status === 'Closed' || !f.due) return '';
  const d = Math.round((new Date(f.due) - new Date(today())) / 864e5);
  return d < 0 ? `<b class="late">Terlambat ${-d} hari</b>` : d === 0 ? '<b class="soon">Batas hari ini</b>' : `Sisa ${d} hari`;
}
function thumb(u) {
  const m = /\/d\/([\w-]+)/.exec(u || '') || /[?&]id=([\w-]+)/.exec(u || '');
  return m ? `<a href="${esc(u)}" target="_blank" rel="noopener" class="th"><img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id=${m[1]}&sz=w240" onerror="this.parentNode.style.display='none'"></a>` : '';
}
function item(f) {
  const cls = f.status === 'Closed' ? 'closed' : isOver(f) ? 'over' : f.status === 'Dikerjakan' ? 'prog' : '';
  const lbl = f.status === 'Closed' ? 'Closed' : (isOver(f) ? 'Overdue - ' : '') + f.status;
  const ini = (f.pic || '-').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const link = (u, t) => /^https:\/\//.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : '';
  return `<div class="it ${cls}">
    <div class="it-h"><span>${esc(f.no)}</span><span class="sev" style="--c:${SEV[f.severity] || '#5B667A'}">${esc(f.severity)}</span><span class="st">${esc(lbl)}</span></div>
    <div class="it-b">${thumb(f.foto)}<div><p class="ds">${esc(f.desk)}</p><div class="chips2"><span>${esc(f.disiplin)}</span><span>${esc(f.lokasi)}</span></div></div></div>
    <div class="it-f"><span class="pic"><i>${esc(ini)}</i>${esc(f.pic || '-')}</span><span>${dueInfo(f)}</span></div>
    <div class="meta" style="margin-top:4px">${f.mulai ? 'Mulai: ' + esc(f.mulai) + ' ' : ''}${f.tutup ? 'Ditutup: ' + esc(f.tutup) + ' ' : ''}${link(f.bukti, 'Foto bukti')}</div>
    <div class="act">${acts(f)}</div></div>`;
}
function renderList() {
  const q = $('q').value.toLowerCase();
  const L = D.findings.filter(f =>
    (filter === 'Semua' || (filter === 'Overdue' ? isOver(f) : f.status === filter)) &&
    (!q || [f.no, f.lokasi, f.desk, f.pic, f.disiplin].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML = pendHtml() + `<div class="meta" style="margin:6px 2px">${L.length} temuan</div>` +
    (L.length ? L.map(item).join('') : '<div class="empty">Tidak ada temuan yang cocok.</div>');
}

let closing = null, bukti = null, ed = {strokes: [], cur: null};
const src = f => 'data:' + f.type + ';base64,' + f.data;

function compress(file) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok({name: file.name, type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.7).split(',')[1]});
    };
    img.src = url;
  });
}

async function prevFoto(inp) {
  const file = inp.files[0]; foto = null; $('prev').hidden = true; $('mark').hidden = true;
  if (!file) { tx('kv', 'readwrite', s => s.delete('draftFoto')); return; }
  foto = await compress(file);
  tx('kv', 'readwrite', s => s.put(foto, 'draftFoto'));
  showFoto();
}
function showFoto() { $('prev').src = src(foto); $('prev').hidden = false; $('mark').hidden = false; }

/* ---- penanda gambar di foto ---- */
function markFoto() { openEd(foto, f => { foto = f; tx('kv', 'readwrite', s => s.put(foto, 'draftFoto')); showFoto(); }); }
function openEd(f, cb) {
  const img = new Image();
  img.onload = () => {
    ed = {img, strokes: [], cur: null, cb};
    $('cv').width = img.width; $('cv').height = img.height;
    drawEd(); $('ed').hidden = false;
  };
  img.src = src(f);
}
function drawEd() {
  const c = $('cv'), x = c.getContext('2d');
  x.drawImage(ed.img, 0, 0);
  x.strokeStyle = '#E53935'; x.lineWidth = Math.max(5, c.width / 100); x.lineCap = x.lineJoin = 'round';
  ed.strokes.concat(ed.cur ? [ed.cur] : []).forEach(st => {
    x.beginPath(); st.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
    if (st.length === 1) x.lineTo(st[0][0] + 0.1, st[0][1]);
    x.stroke();
  });
}
function pt(e) { const c = $('cv'), r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; }
$('cv').addEventListener('pointerdown', e => { ed.cur = [pt(e)]; e.target.setPointerCapture(e.pointerId); drawEd(); });
$('cv').addEventListener('pointermove', e => { if (ed.cur) { ed.cur.push(pt(e)); drawEd(); } });
$('cv').addEventListener('pointerup', () => { if (ed.cur) { ed.strokes.push(ed.cur); ed.cur = null; drawEd(); } });
function edUndo() { ed.strokes.pop(); drawEd(); }
function edClose(ok) {
  if (ok) ed.cb({name: 'tanda.jpg', type: 'image/jpeg', data: $('cv').toDataURL('image/jpeg', 0.7).split(',')[1]});
  $('ed').hidden = true;
}

/* ---- tutup temuan: wajib foto bukti ---- */
function closeIt(no) {
  closing = no; bukti = null; $('cl-t').textContent = 'Tutup ' + no;
  $('cl-foto').value = ''; $('cl-prev').hidden = true; $('cl-ok').disabled = true; $('cl').hidden = false;
}
async function prevBukti(inp) {
  const file = inp.files[0]; bukti = null; $('cl-prev').hidden = true; $('cl-ok').disabled = true;
  if (!file) return;
  bukti = await compress(file); $('cl-prev').src = src(bukti); $('cl-prev').hidden = false; $('cl-ok').disabled = false;
}
async function sendClose() {
  if (!bukti) return toast('Foto bukti wajib dilampirkan.');
  const by = ($('f-by').value || localStorage.getItem('by') || '').trim();
  if (!by) { $('cl').hidden = true; return toast('Isi nama inspektur di tab Tambah dulu.'); }
  await tx('q', 'readwrite', s => s.put({cid: crypto.randomUUID(), action: 'close', no: closing, foto: bukti, by, at: Date.now()}));
  $('cl').hidden = true;
  toast(navigator.onLine ? 'Mengirim bukti...' : 'Tersimpan di HP, dikirim saat ada sinyal');
  await refreshQ(); renderList(); sync();
}

async function save() {
  const f = {disiplin: $('f-disiplin').value, lokasi: $('f-lokasi').value.trim(), desk: $('f-desk').value.trim(),
    severity: $('f-sev').value, pic: $('f-pic').value, due: $('f-due').value, foto};
  const by = $('f-by').value.trim();
  if (!f.lokasi || !f.desk) return toast('Isi lokasi dan deskripsi dulu.');
  if (!by) return toast('Isi nama inspektur dulu.');
  localStorage.setItem('by', by);
  $('save').disabled = true;
  await tx('q', 'readwrite', s => s.put({cid: crypto.randomUUID(), data: f, by, at: Date.now()}));
  localStorage.removeItem('draft'); tx('kv', 'readwrite', s => s.delete('draftFoto'));
  $('f-desk').value = ''; $('f-foto').value = ''; $('prev').hidden = true; $('mark').hidden = true; foto = null;
  $('save').disabled = false;
  toast(navigator.onLine ? 'Tersimpan, mengirim...' : 'Tersimpan di HP, dikirim saat ada sinyal');
  await refreshQ(); renderList(); document.querySelector('[data-v=list]').click();
  sync();
}

window.addEventListener('online', sync);
window.addEventListener('offline', refreshQ);
$('f-by').value = localStorage.getItem('by') || '';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
const FIELDS = ['f-disiplin', 'f-lokasi', 'f-desk', 'f-sev', 'f-pic', 'f-due'];
function saveDraft() { const d = {}; FIELDS.forEach(i => d[i] = $(i).value); localStorage.setItem('draft', JSON.stringify(d)); }
function restoreDraft() {
  try { const d = JSON.parse(localStorage.getItem('draft') || '{}'); FIELDS.forEach(i => { if (d[i]) $(i).value = d[i]; }); } catch (e) {}
}
FIELDS.forEach(i => { $(i).addEventListener('input', saveDraft); $(i).addEventListener('change', saveDraft); });
tx('kv', 'readonly', s => s.get('draftFoto')).then(f => {
  if (f) { foto = f; showFoto(); }
});
const t0 = localStorage.getItem('tab');
if (t0) { const bt = document.querySelector('[data-v="' + t0 + '"]'); if (bt) bt.click(); }
load().then(sync);
</script>
</body>
